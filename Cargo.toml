[package]
name = "speakmind-server"
version = "0.1.0"
edition = "2021"
description = "Pronunciation assessment server: wav2vec2 phoneme CTC + forced alignment + GOP"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
libloading = "0.9.0"
ort = { version = "=2.0.0-rc.15", features = ["ndarray"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time"] }

[profile.release]
opt-level = 3
